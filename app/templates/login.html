{% extends "base.html" %}
{% block title %}Log in · Smart Lecture Summarizer{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<section class="auth" aria-labelledby="auth-title">
    <canvas class="stars stars--hero" data-stars="110" aria-hidden="true"></canvas>
    <div class="blob blob--auth" data-blob data-blob-seed="1.3" aria-hidden="true"><canvas></canvas></div>

    <form class="auth__card glass" method="POST" novalidate>
        <h1 id="auth-title">Welcome back</h1>
        <p class="auth__lede">Log in to see your lectures and their summaries.</p>

        <label class="field">
            <span>Username</span>
            <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
        </label>

        <label class="field">
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <button class="btn btn--light btn--lg btn--block" type="submit">Log in</button>

        <p class="auth__switch">New here? <a href="{{ url_for('main.register') }}">Create an account</a></p>
    </form>
</section>
{% endblock %}
